org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 full mode
android.enableR8.fullMode=true

# exFAT workspace note:
# This repo may live on an exFAT external disk that lacks Unix permissions and
# symlinks, which can corrupt the Gradle cache. Do NOT rely on a .gradle cache
# inside the repo. Build with the Gradle user home on an internal disk:
#   export GRADLE_USER_HOME=/home/noneya/.gradle
# or pass --gradle-user-home /home/noneya/.gradle
# See docs/BUILDING.md.
